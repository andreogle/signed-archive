# signed-archive settings. Pass another copy with --config <path> (or CONFIG); without either, ./signed-archive.yaml is
# read. What to archive is in the two files named under `catalog` below. Settings are optional: a command-line flag beats an
# environment variable, which beats this file, which beats the built-in default. A misspelled key is an error.
# This copy is committed, so keep secrets such as the heartbeat URL out of it: set HEARTBEAT_URL, or use a private copy.

# SQLite archive (DB_PATH).
db: data/archive.sqlite

# debug, info, warn or error (LOG_LEVEL).
logLevel: info

archive:
  # Seconds per polling cycle, at least 15 (POLL_INTERVAL_SECONDS).
  interval: 60
  # Pinged after every cycle that reached the API, e.g. a healthchecks.io check (HEARTBEAT_URL).
  # heartbeatUrl: https://hc-ping.com/your-check-id
  # Also serve the explorer from the archiver process (SERVE).
  serve: false

# The explorer and its JSON API, including /api/records for peers (HOST, PORT).
serve:
  host: 127.0.0.1
  port: 3000

health:
  # `health` fails when the newest request is older than this many seconds (HEALTH_MAX_AGE_SECONDS).
  maxAge: 300

# Closed days move from SQLite to Parquet files once they ended this many days ago (PARQUET_AFTER_DAYS). Each file is
# read back and matched against SQLite, and registered with its SHA-256, before its records leave SQLite.
parquet:
  # Directory for the files (PARQUET_DIR); defaults to parquet/ next to the database.
  # dir: data/parquet
  afterDays: 7

# Other archives to ask for records this one missed, by the base URL of their explorer. Each peer is asked about each
# window once, with one recheck after an hour if the peer also missed part of it. Records are re-checked like any other input,
# so a peer needs no trust. Peers must expose their explorer (only /api/records is used) where this archive can reach it.
peers: []
#  - https://archive.example.org

# The airnode and feed lists, generated by `bun run airnodes`. Paths are relative to this file. Point them at your own
# copies to archive a different set of providers or feeds.
catalog:
  airnodes: config/airnodes.yaml
  feeds: config/feeds.yaml
