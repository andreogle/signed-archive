name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Airnode list, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the comment is the tag. Dependabot bumps both.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Bun from mise.toml, the same file used locally.
      - name: Set up Bun (mise)
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      # The compiled binary is what the Docker image ships, so a break in it fails here too.
      - name: Build
        run: bun run build
