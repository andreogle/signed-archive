name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Airnode list, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commit SHAs; the comment is the tag. Dependabot bumps both.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs Bun from mise.toml, the same file used locally.
      - name: Set up Bun (mise)
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check
